services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicle_management
      POSTGRES_USER: vmgmt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./start-prod.sh, it creates .env}
    ports:
      # Loopback by default. Set DB_BIND=0.0.0.0 in .env to reach it from outside the VM.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmgmt -d vehicle_management"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      VM_DATABASE_URL: jdbc:postgresql://db:5432/vehicle_management
      VM_DATABASE_USER: vmgmt
      VM_DATABASE_PASSWORD: ${DB_PASSWORD}
      VM_JWT_SECRET: ${VM_JWT_SECRET:?run ./start-prod.sh, it creates .env}
      VM_ADMIN_USERNAME: ${VM_ADMIN_USERNAME:-}
      VM_ADMIN_PASSWORD: ${VM_ADMIN_PASSWORD:-}
      VM_ADMIN_MOBILE: ${VM_ADMIN_MOBILE:-}
      VM_CORS_ORIGINS: ${VM_CORS_ORIGINS:-http://localhost:5173}
      VM_IMAGE_BACKEND: ${VM_IMAGE_BACKEND:-local}
      VM_IMAGE_DIR: /data/uploads
      VM_GCS_BUCKET: ${VM_GCS_BUCKET:-}
      VM_GCS_PREFIX: ${VM_GCS_PREFIX:-}
      VM_SEED_SAMPLE: "false"
    volumes:
      - uploads:/data/uploads
      - ./secrets:/secrets:ro
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Optional browser DB viewer: ./start-prod.sh does not start it; run
  #   docker compose --profile pgadmin up -d pgadmin
  # Published on loopback only -- a database admin console must not sit on the open internet.
  # Reach it from your machine with an SSH tunnel:  ssh -L 5050:127.0.0.1:5050 user@server
  # then open http://localhost:5050. Sign in with PGADMIN_EMAIL / PGADMIN_PASSWORD from .env;
  # the "vehicle_management" server is pre-registered and asks for DB_PASSWORD once.
  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["pgadmin"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "${PGADMIN_BIND:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin

  # Optional HTTPS: enabled by start-prod.sh when DOMAIN is set in .env.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      UI_UPSTREAM: ${UI_UPSTREAM:-glittery-faun-ee6d6f.netlify.app}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  uploads:
  caddy_data:
  pgadmin_data:
